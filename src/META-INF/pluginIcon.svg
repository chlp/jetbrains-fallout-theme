<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- CRT monitor bezel -->
  <rect x="1" y="1" width="38" height="38" rx="8" fill="#0c1a0d" stroke="#1f8a3f" stroke-width="2"/>
  <!-- Screen -->
  <rect x="5" y="5" width="30" height="30" rx="5" fill="#050b05"/>
  <!-- Scanlines -->
  <g fill="#18ff62" opacity="0.07">
    <rect x="5" y="8" width="30" height="1"/>
    <rect x="5" y="12" width="30" height="1"/>
    <rect x="5" y="16" width="30" height="1"/>
    <rect x="5" y="20" width="30" height="1"/>
    <rect x="5" y="24" width="30" height="1"/>
    <rect x="5" y="28" width="30" height="1"/>
    <rect x="5" y="32" width="30" height="1"/>
  </g>
  <!-- Prompt ">" -->
  <path d="M10 13 L17 19 L10 25" fill="none" stroke="#18ff62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block -->
  <rect x="20" y="23" width="10" height="3.5" rx="1" fill="#18ff62"/>
</svg>
